name: Build Apolo (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create placeholder Freesound key
        shell: pwsh
        run: Copy-Item Ares.AudioSource.Freesound/ApiKey.example.cs Ares.AudioSource.Freesound/ApiKey.cs

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download WebView2 libraries
        shell: pwsh
        run: |
          $v = "1.0.2592.51"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2
          Copy-Item wv2/lib/net462/Microsoft.Web.WebView2.Core.dll Libraries/
          Copy-Item wv2/lib/net462/Microsoft.Web.WebView2.WinForms.dll Libraries/
          Copy-Item wv2/runtimes/win-x86/native/WebView2Loader.dll Libraries/

      - name: Download cloudflared (tunnel for the remote control)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile Libraries/cloudflared.exe

      - name: Build solution
        run: msbuild Ares.sln /m /restore:false /p:Configuration=Release /p:Platform=x86 /v:minimal

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dirs = Get-ChildItem -Recurse -Directory -Filter "Release" | Where-Object { $_.FullName -match "\\bin\\Release$" }
          foreach ($d in $dirs) { Copy-Item "$($d.FullName)\*" dist -Recurse -Force -ErrorAction SilentlyContinue }
          Copy-Item "Libraries\*" dist -Recurse -Force -ErrorAction SilentlyContinue

      - name: Setup Node.js (for the Discord bridge)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package the Discord bridge (Node.js + libraries)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/discord | Out-Null
          Copy-Item Ares.Player/Discord/package.json dist/discord/
          Copy-Item Ares.Player/Discord/discord-bridge.js dist/discord/
          Push-Location dist/discord
          npm install --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          Copy-Item (Get-Command node).Source dist/discord/node.exe

      - name: Package the Stream Deck plugin
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/StreamDeck | Out-Null
          $src = (Resolve-Path "StreamDeck/com.igorteuri.apolo.sdPlugin").Path
          $dest = Join-Path (Resolve-Path "dist/StreamDeck").Path "Apolo.streamDeckPlugin"
          if (Test-Path $dest) { Remove-Item $dest }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $dest, [System.IO.Compression.CompressionLevel]::Optimal, $true)

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Apolo-windows
          path: dist
