name: Build Apolo (Windows)

# Apolo runs on .NET 8 (self-contained: the person who installs it does not need to install .NET).
# The projects of the program are in the folder net8/ (generated by tools/gen_net8.py from the old project files).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the version (file VERSION + build number)
        shell: pwsh
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $version = "$base.${{ github.run_number }}.0"
          Write-Host "Apolo version: $version"
          $f = "src/Ares.Player/Properties/AssemblyInfo.cs"
          $t = [System.IO.File]::ReadAllText($f)
          $t = [regex]::Replace($t, 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$version`")")
          $t = [regex]::Replace($t, 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$version`")")
          [System.IO.File]::WriteAllText($f, $t)

      - name: Setup MSBuild (for the small firewall helper)
        uses: microsoft/setup-msbuild@v2

      - name: Publish Apolo (.NET 8, self-contained, x86)
        shell: pwsh
        run: |
          dotnet publish net8/Ares.Player.Net8.csproj -c Release -r win-x86 --self-contained true --nologo -v:q -clp:ErrorsOnly -o dist
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build the firewall helper (Ares.WinSecurity, .NET Framework 4.8)
        shell: pwsh
        run: |
          msbuild tools/WinSecurity.slnf /restore:false /p:Configuration=Release /p:Platform=x86 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path dist/WinSecurity | Out-Null
          Get-ChildItem src/bin/Release -File | Where-Object { $_.Extension -ne ".pdb" -and $_.Extension -ne ".xml" } | ForEach-Object { Copy-Item $_.FullName dist/WinSecurity -Force }
          if (-not (Test-Path "dist/WinSecurity/Ares.WinSecurity.exe")) { throw "Ares.WinSecurity.exe was not built" }

      - name: Image bank (pictures for the buttons)
        shell: pwsh
        run: |
          Copy-Item BancoDeImagens dist/BancoDeImagens -Recurse -Force
          if (-not (Test-Path "dist/BancoDeImagens/indice.txt")) { throw "BancoDeImagens/indice.txt is missing" }

      - name: Native libraries and the tunnel of the remote control
        shell: pwsh
        run: |
          # audio decoding and rights check (the BASS library is not free for commercial use and is never part of Apolo)
          foreach ($f in @("chromaprint.dll","avcodec-54.dll","avutil-52.dll","msvcp100.dll","msvcr100.dll")) {
            if (Test-Path "Libraries/$f") { Copy-Item "Libraries/$f" dist -Force } else { Write-Host "missing: $f" }
          }
          Remove-Item dist\bass*.dll, dist\Bass*.dll -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile dist/cloudflared.exe

      - name: Automatic tests
        # a failing test stops the build, so no installer is made from a broken version
        shell: pwsh
        run: |
          dotnet test tests/Apolo.Tests/Apolo.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Setup Node.js (for the Discord bridge)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package the Discord bridge (Node.js + libraries)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/discord | Out-Null
          Copy-Item src/Ares.Player/Discord/package.json dist/discord/
          Copy-Item src/Ares.Player/Discord/discord-bridge.js dist/discord/
          Push-Location dist/discord
          npm install --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          Copy-Item (Get-Command node).Source dist/discord/node.exe

      - name: Package the Stream Deck plugin
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/StreamDeck | Out-Null
          $src = (Resolve-Path "StreamDeck/com.igorteuri.apolo.sdPlugin").Path
          $dest = Join-Path (Resolve-Path "dist/StreamDeck").Path "Apolo.streamDeckPlugin"
          if (Test-Path $dest) { Remove-Item $dest }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $dest, [System.IO.Compression.CompressionLevel]::Optimal, $true)

      - name: Package the Foundry VTT module
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FoundryModule | Out-Null
          $src = (Resolve-Path "FoundryModule/apolo-audio").Path
          $dest = Join-Path (Resolve-Path "dist/FoundryModule").Path "apolo-audio.zip"
          if (Test-Path $dest) { Remove-Item $dest }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $dest, [System.IO.Compression.CompressionLevel]::Optimal, $false)

      - name: Build the installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $v = (Get-Item dist/Apolo.exe).VersionInfo.FileVersion
          $parts = $v.Split('.')
          $version = "$($parts[0]).$($parts[1]).$($parts[2])"
          Write-Host "Apolo version: $version"
          & $iscc "/DMyAppVersion=$version" Setup/Apolo.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Apolo-installer
          path: installer
          if-no-files-found: ignore

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Apolo-windows
          path: dist
