name: Apolo .NET 8 (small build)

# Only the projects of the .NET 8 migration (folder net8/). It does not package the Discord bridge, Stream Deck,
# Foundry module or installer: those do not depend on .NET and are tested by the big build (build.yml) on master.
on:
  workflow_dispatch:

jobs:
  net8:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the projects for .NET 8
        shell: pwsh
        run: |
          $ok = @(); $bad = @()
          foreach ($n in @("Ares.Ipc","Ares.Data","Ares.Settings","Ares.Tags","Ares.ModelInfo","Ares.Playing","Ares.CommonGUI","Ares.TagsImport","Ares.Players","Ares.Player")) {
            $f = Get-Item "net8/$n.Net8.csproj"
            Write-Host "=== $($f.Name)"
            dotnet build $f.FullName -c Release --nologo -v:q -clp:ErrorsOnly
            if ($LASTEXITCODE -eq 0) { $ok += $f.Name } else { $bad += $f.Name }
          }
          Write-Host "=============== RESUMO .NET 8 ==============="
          Write-Host ("COMPILAM: " + ($ok -join ", "))
          Write-Host ("FALHARAM: " + ($bad -join ", "))
          if ($bad.Count -gt 0) { exit 1 }

      - name: Publish Apolo for .NET 8 (self-contained, x86)
        shell: pwsh
        run: |
          dotnet publish net8/Ares.Player.Net8.csproj -c Release -r win-x86 --self-contained true --nologo -v:q -clp:ErrorsOnly -o dist-net8
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # native libraries (audio decoding, rights check) that already exist in the repository
          foreach ($f in @("chromaprint.dll","avcodec-54.dll","avutil-52.dll","msvcp100.dll","msvcr100.dll")) {
            if (Test-Path "Libraries/$f") { Copy-Item "Libraries/$f" dist-net8 -Force }
          }
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile dist-net8/cloudflared.exe
          Get-ChildItem dist-net8 | Select-Object -First 80 Name, Length | Format-Table -AutoSize
          Write-Host ("Apolo.exe exists: " + (Test-Path "dist-net8/Apolo.exe"))

      - name: Setup Node.js (for the Discord bridge)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Package the Discord bridge, Stream Deck plugin and Foundry module
        shell: pwsh
        run: |
          # Discord bridge (Node.js + libraries)
          New-Item -ItemType Directory -Force -Path dist-net8/discord | Out-Null
          Copy-Item src/Ares.Player/Discord/package.json dist-net8/discord/
          Copy-Item src/Ares.Player/Discord/discord-bridge.js dist-net8/discord/
          Push-Location dist-net8/discord
          npm install --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { Write-Host "npm install failed" }
          Pop-Location
          Copy-Item (Get-Command node).Source dist-net8/discord/node.exe
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # Stream Deck plugin
          New-Item -ItemType Directory -Force -Path dist-net8/StreamDeck | Out-Null
          $src = (Resolve-Path "StreamDeck/com.igorteuri.apolo.sdPlugin").Path
          $dest = Join-Path (Resolve-Path "dist-net8/StreamDeck").Path "Apolo.streamDeckPlugin"
          if (Test-Path $dest) { Remove-Item $dest }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $dest, [System.IO.Compression.CompressionLevel]::Optimal, $true)
          # Foundry VTT module
          New-Item -ItemType Directory -Force -Path dist-net8/FoundryModule | Out-Null
          $src = (Resolve-Path "FoundryModule/apolo-audio").Path
          $dest = Join-Path (Resolve-Path "dist-net8/FoundryModule").Path "apolo-audio.zip"
          if (Test-Path $dest) { Remove-Item $dest }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $dest, [System.IO.Compression.CompressionLevel]::Optimal, $false)

      - name: Upload Apolo .NET 8
        uses: actions/upload-artifact@v4
        with:
          name: Apolo-net8
          path: dist-net8
